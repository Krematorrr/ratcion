name: Update Smolensk Prices

on:
  # Запуск каждый день в 03:00 UTC (06:00 по Москве / Смоленску)
  schedule:
    - cron: '0 3 * * *'
  # Кнопка для ручного запуска во вкладке Actions в любой момент
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Smolensk price parser
        run: python3 smolensk_price_parser.py

      - name: Commit and push updated JSON
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add smolensk_prices.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update Smolensk prices [skip ci]" && git push)
